<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="frFlag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002395" />
      <stop offset="33%" stop-color="#002395" />
      <stop offset="33%" stop-color="#ffffff" />
      <stop offset="66%" stop-color="#ffffff" />
      <stop offset="66%" stop-color="#ed2939" />
      <stop offset="100%" stop-color="#ed2939" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Tricolor Accent Ribbon -->
  <rect x="72" y="56" width="368" height="12" rx="6" fill="url(#frFlag)" />
  
  <!-- Ballot Urn Base -->
  <rect x="120" y="210" width="272" height="210" rx="28" fill="#1e293b" stroke="#334155" stroke-width="8" />
  
  <!-- Urn Slot Lid -->
  <rect x="100" y="180" width="312" height="40" rx="16" fill="#334155" stroke="#475569" stroke-width="4" />
  <!-- Slot opening -->
  <rect x="196" y="194" width="120" height="12" rx="6" fill="#0f172a" />
  
  <!-- Citizen Voting Ballot sliding in -->
  <g transform="translate(0, -10)">
    <rect x="206" y="110" width="100" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="4" transform="rotate(-6 256 160)" />
    <!-- Checkmark on ballot -->
    <path d="M232 155 L248 170 L280 135" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6 256 160)" />
  </g>
  
  <!-- Gold Civic Star -->
  <polygon points="256,260 268,295 304,295 275,315 286,350 256,330 226,350 237,315 208,295 244,295" fill="url(#goldGrad)" />
  
  <!-- Subtitle Text -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">DEMOCRA'APP</text>
</svg>
